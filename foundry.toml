[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
# Robinhood Chain is built on Arbitrum Nitro. Targeting Paris keeps the output
# free of any opcode the rollup hasn't turned on yet.
evm_version = "paris"
optimizer = true
optimizer_runs = 1000
# createAgent receives its whole policy as individual arguments, which is too
# deep for the legacy pipeline. The IR compiler copes with it, and Nitro has no
# trouble with what it produces.
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

# Explorer settings for Blockscout. Passing `--chain robinhood` to
# `forge verify-contract ... --verifier blockscout` picks the URL up from here.
[etherscan]
robinhood = {key = "${BLOCKSCOUT_API_KEY}", url = "https://robinhoodchain.blockscout.com/api/", chain = 4663}
robinhood_testnet = {key = "${BLOCKSCOUT_API_KEY}", url = "https://explorer.testnet.chain.robinhood.com/api/", chain = 46630}
